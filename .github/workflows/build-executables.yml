name: Build Desktop Executables

on:
  push:
    branches: [main, master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  # ── Linux 原生构建 ──────────────────────────────────────────────
  build-linux:
    name: Linux standalone (Nuitka)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install nuitka ordered-set maturin

      - name: Build and install Rust extension (native)
        working-directory: rust_lib
        run: |
          maturin build --release --out dist
          pip install --force-reinstall dist/rust_lib-*.whl

      - name: Nuitka build (Linux)
        run: |
          python -m nuitka \
            --standalone \
            --follow-imports \
            --enable-plugin=pyside6 \
            --static-libpython=no \
            --include-package=ui \
            --include-package=core \
            --include-package=base \
            --include-package=processor \
            --include-package=io_utils \
            --include-package=matio \
            --include-package=utils \
            --include-package=emtf \
            --include-package=builtin_plugins \
            --include-package=plugins \
            --include-package=output_tools \
            --include-module=rust_lib \
            --include-module=plugin_api \
            --include-module=pydoc \
            --include-data-dir=python/src/bin=bin \
            --output-dir=python/build/nuitka \
            --assume-yes-for-downloads \
            --show-progress \
            python/src/main.py
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src

      - name: Move to outputs
        run: |
          mkdir -p outputs
          cp -r python/build/nuitka/main.dist outputs/mtpro-linux-x86_64
          cp python/requirements.txt outputs/mtpro-linux-x86_64/

      - name: Package artifact
        run: |
          cd outputs
          zip -r "${{ github.workspace }}/mtpro-linux-x86_64.zip" mtpro-linux-x86_64

      - uses: actions/upload-artifact@v5
        with:
          name: mtpro-linux-x86_64
          path: mtpro-linux-x86_64.zip
          retention-days: 30

  # ── Windows 构建（原生 Windows runner）─────────────────────────
  build-windows:
    name: Windows standalone (Nuitka)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Fetch Windows EMTF native extension
        uses: actions/checkout@v6
        with:
          ref: 66abc9be2d65ab5bbdbb196c858273fd200c48dd
          path: .ci-emtf

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set Windows cache directory
        run: '"NUITKA_CACHE_DIR=$env:RUNNER_TEMP\mtpro-nuitka-cache" >> $env:GITHUB_ENV'

      - name: Restore Windows build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\mtpro-nuitka-cache
            rust_lib/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-msvc-py314-${{ hashFiles('rust_lib/Cargo.lock', 'python/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            windows-msvc-py314-${{ hashFiles('rust_lib/Cargo.lock', 'python/requirements.txt') }}-
            windows-msvc-py314-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install nuitka ordered-set maturin

      - name: Install and verify EMTF native extension
        run: |
          $site = python -c "import site; print(site.getsitepackages()[0])"
          Copy-Item -Recurse .ci-emtf/ci-deps/emtf_rs "$site/emtf_rs"
          $env:PYTHONPATH = "${{ github.workspace }}/python/src"
          @'
          import numpy as np
          import emtf_rs
          from base.emtf_native import estimate_native_emtf
          from emtf.estimate import decimation_with_fft_window
          from emtf.types import FrequencyBand
          assert callable(emtf_rs.estimate_emtf_bands)
          assert callable(emtf_rs.emtf_spectra)
          rng = np.random.default_rng(42)
          hx, hy = rng.normal(size=(2, 32768))
          ex, ey = .3 * hx + .8 * hy, -.7 * hx + .2 * hy
          result = estimate_native_emtf(
              ex, ey, hx, hy, sample_rate_hz=.2,
              decimation_levels=decimation_with_fft_window(.2, 128)[:4],
              bands=[FrequencyBand(1, 18, 25)], station_name='TEST', hz=None,
          )
          assert len(result.frequencies_hz) == 1
          print('Windows EMTF native calculation verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'EMTF native validation failed' }

      - name: Build and install Rust extension (Windows)
        working-directory: rust_lib
        run: |
          maturin build --release --out dist
          pip install --force-reinstall (Get-Item dist/rust_lib-*.whl).FullName

      - name: Nuitka build (Windows)
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}/python/src"
          python -m nuitka `
            --standalone `
            --follow-imports `
            --enable-plugin=pyside6 `
            --msvc=latest `
            --include-package=ui `
            --include-package=core `
            --include-package=base `
            --include-package=processor `
            --include-package=io_utils `
            --include-package=matio `
            --include-package=utils `
            --include-package=emtf `
            --include-package=builtin_plugins `
            --include-package=plugins `
            --include-package=output_tools `
            --include-package=emtf_rs `
            --include-module=rust_lib `
            --include-module=plugin_api `
            --include-module=pydoc `
            --include-data-dir=python/src/bin=bin `
            --output-dir=python/build/nuitka-windows `
            --assume-yes-for-downloads `
            --show-progress `
            python/src/main.py

      - name: Move to outputs
        run: |
          New-Item -ItemType Directory -Force -Path outputs
          Copy-Item -Recurse python/build/nuitka-windows/main.dist outputs/mtpro-windows-x86_64
          Copy-Item python/requirements.txt outputs/mtpro-windows-x86_64/
          Rename-Item outputs/mtpro-windows-x86_64/main.exe MTPro.exe
          New-Item -ItemType Directory -Force -Path outputs/mtpro-windows-x86_64/bin/win64 | Out-Null
          Copy-Item python/src/bin/win64/dnff.exe,python/src/bin/win64/tranmt.exe outputs/mtpro-windows-x86_64/bin/win64/

      - name: Verify both packaged Rust extensions
        run: |
          $env:PYTHONPATH = ""
          & outputs/mtpro-windows-x86_64/MTPro.exe --verify-emtf-rs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Rust extension validation failed' }

      - name: Package artifact
        run: |
          Compress-Archive -Path outputs/mtpro-windows-x86_64 -DestinationPath mtpro-windows-x86_64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: mtpro-windows-x86_64
          path: mtpro-windows-x86_64.zip
          retention-days: 30

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        run: |
          $ver = python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])"
          Write-Host "Installer version: $ver"
          iscc "/DMyAppVersion=$ver" scripts\mtpro_windows.iss

      - uses: actions/upload-artifact@v5
        with:
          name: MTPro-Setup
          path: outputs/MTPro-Setup-*.exe
          retention-days: 90

      - name: Retain MSVC intermediate build files
        uses: actions/upload-artifact@v5
        with:
          name: mtpro-windows-msvc-build
          path: python/build/nuitka-windows/main.build/
          if-no-files-found: error
          retention-days: 90
